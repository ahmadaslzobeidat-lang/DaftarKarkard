name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p android-source
          unzip -q DaftarKarkard-Android-Source.zip -d android-source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_FILE=$(find android-source -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Project settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(r'compileOptions\s*\{[^}]*\}', '', s)
          s = re.sub(r'kotlinOptions\s*\{[^}]*\}', '', s)

          s = s.replace('android {', """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """, 1)

          p.write_text(s)
          PY

          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-karkard-apk
          path: android-source/**/app/build/outputs/apk/debug/app-debug.apk
